<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px;
            cursor: pointer;
            margin-left: 5px;
        }

        li {
            margin: 10px;
        }

        .done {
            text-decoration: line-through;
        }

</head>

<body>

    <h2>To-Do App</h2>
    <input id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ul id="list"></ul>


</body>
<script src="script.js"></script>

</html>
